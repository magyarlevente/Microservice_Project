apiVersion: v1
kind: Service
metadata:
  name: product-db-service
spec:
  ports:
  - port: 5432
  selector:
    app: product-db
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
spec:
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin"
        - name: POSTGRES_DB
          value: "productsdb"